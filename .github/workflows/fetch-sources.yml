# Jogforrások letöltése a repo-ba (parlament.hu / kormany.hu), hogy a kalauz hivatkozásai ellenőrizhetők legyenek.
name: fetch-sources
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fetch-sources.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download T/930 (vagyonadó törvényjavaslat)
        run: |
          mkdir -p sources
          curl -fsSL -A "Mozilla/5.0" -o sources/T930-vagyonado-torvenyjavaslat.pdf "https://www.parlament.hu/irom43/00930/00930.pdf"
          ls -la sources
      - name: Commit
        run: |
          git config user.name "fetch-sources[bot]"
          git config user.email "noreply@github.com"
          git add sources
          git commit -m "sources: T/930 vagyonadó törvényjavaslat (parlament.hu)" || echo "no change"
          git push
